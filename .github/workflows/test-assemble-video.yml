name: Test Assemble Video

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Assemble video
        env:
          CREATOMATE_API_KEY: ${{ secrets.CREATOMATE_API_KEY }}
        run: python assemble_video.py

      - name: Upload assembled video
        uses: actions/upload-artifact@v4
        with:
          name: assembled-video
          path: output/assembled_video.mp4
