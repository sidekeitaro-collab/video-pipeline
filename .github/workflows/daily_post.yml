name: Daily Short Video Post

on:
  schedule:
    - cron: "0 12 * * *"  # 毎日 21:00 JST (UTC+9)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true にすると生成のみ行い、git push・投稿はスキップする"
        type: boolean
        default: false

permissions:
  contents: write  # main.pyがpublic/videos/配下の動画とlogs/theme-history.jsonをpushする

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore YouTube OAuth token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: printf '%s' "$YOUTUBE_TOKEN_JSON" > youtube_token.json

      - name: Restore YouTube client secrets
        env:
          CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
        run: printf '%s' "$CLIENT_SECRETS_JSON" > client_secrets.json

      - name: Run daily pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 審査待ち・未契約のため今はmain.py側で使われていないが、揃い次第すぐ使える
          # よう先に渡しておく(値が空でも失敗しない)。
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_DOMAIN_VERIFIED: ${{ secrets.TIKTOK_DOMAIN_VERIFIED }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python main.py ${{ (github.event.inputs.dry_run == 'true') && '--dry-run' || '' }}

      - name: Upload dry-run video for inspection
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-video
          path: output/*.mp4
